
spring:
  datasource:
   

    url: ${SUPABASE_DB_URL}          
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10          
      minimum-idle: 2
      max-lifetime: 240000           
      keepalive-time: 120000         
      idle-timeout: 180000

  jpa:
    show-sql: false
    properties:
      hibernate:
        ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

logging:
  level:
    com.deepthought.hrms: INFO
    org.hibernate.SQL: WARN

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://staging.yourapp.com}
